gpu: 0
debug:
  n_rows: null  # Set to integer (e.g., 100000) for quick testing, null for full data

dataset_id: "TaobaoAd"
vocab_pruning:
  enabled: 1
  min_vocab_size: 400000
  min_reduction_ratio: 0.3
  mode: "offline"           # "offline" = pre-mapped data, "runtime" = RemappedEmbedding
  save_fp16: 1           # Save model weights in half-precision

search_space:
  seed: [42, 2024, 2026]      # 搜索不同随机种子
#  seed: [2024]    # 搜索不同随机种子
  reranking:
#    model: ["DCNv3", "DNN", "PNN"]
    model: ["PNN"]
    model_params.num_negatives: [4, 10, 20]
#    model_params.embedding_dim: [4]
    model_params.hidden_units:
      - [ 512, 256, 128, 64 ]
#      - [ 512, 256]
      - [ 512, 256, 128 ]
#      - [ 512, 256, 64 ]
#      - [ 512, 128, 64 ]
#      - [ 256, 128, 64, 32 ]
#      - [ 1024, 512, 256, 128, 64 ]
#      - [ 2048, 1024, 512, 256, 128 ]

  cloud_teacher:
      # "distill" = KD loss only, "inject" = inject logits as feature, "none" = no teacher, "hybrid_inject", "residual_inject"
    version: ["FCN"]
    cloud_feature_dropout: [ 0, 0.2 ]
    residual_weight: [ 0, 1, 2, 0.1]
    cloud_feature_scale: [ 0, 1 ]  # teacher logit 先除以 scale
#    cloud_feature_scale: [ 0, 1, 5, 10 ]  # teacher logit 先除以 scale
#    model_params.use_cloud_score: [0, 1]
#    kd_loss_weight: [0.01, 0.1, 1]
#    kd_loss_weight: [0, 1, 2, 5]
#    kd_loss_type: ["mse"]
#    kd_temperature: [1, 2, 4]
#    kd_loss_type: ["mse", "kl_div", "cosine"]
fixed_overrides:
  cloud_teacher:
    cloud_residual_scale: 1
    mode: "hybrid_inject"
#    cloud_score_scale: 10.0  # teacher logit 先除以 scale
#    residual_weight: 1.0  # teacher 残差权重
  preranking:
    model: "DCNv3"
    training.epochs: 30
    model_params.patience: 2
    model_params.embedding_dim: 32
    model_params.use_feature_encoder: 1
  reranking:
    training.epochs: 30
    model_params.metrics_k: [1, 10, 50, 100]
    model_params.embedding_dim: 4
#    model_params.use_diversity_loss: 1
    model_params.use_feature_encoder: 1
    model_params.use_cloud_score: 0
    model_params.monitor: "gAUC"
    features: ["FG1", "FG2", "FG3"]
    neg_sampling_pool: candidate  # candidate, full
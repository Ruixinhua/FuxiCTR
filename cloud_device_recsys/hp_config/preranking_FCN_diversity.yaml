# =============================================================================
# Hyperparameter Search Configuration Example
# =============================================================================
# This file demonstrates how to define a hyperparameter search space.
# 
# Usage:
#   python run_hyperparam_search.py \
#       --search_config ./config/search_example.yaml \
#       --base_config ./config/TaobaoOpenMCC_full_DT_DIN_DIN.yaml \
#       --output_dir ./outputs/hp_search \
#       --gpu 0

# -----------------------------------------
# Search Space Definition
# -----------------------------------------
# Format: stage_name.parameter_path: [list of values to try]
# 
# Parameter paths use dot notation to access nested config values.
# For example, 'model_params.embedding_dim' accesses:
#   stages:
#     retrieval:
#       model_params:
#         embedding_dim: <value>

search_space:
  preranking:
    model: ["DCNv3"]
#    model_params.diversity_lambda: [0.0001, 0.001]
#    model_params.num_heads: [ 1, 2, 4 ]
#    model_params.num_heads: [ 32 ]
#    model_params.loss_type: ["bpr"]
#    model_params.embedding_dim: [ 32 ]
#    model_params.num_deep_cross_layers: [1]
#    model_params.num_shallow_cross_layers: [1]
#    model_params.diversity_theta: [ 0.00005, 0.0001, 0.0005, 0.001 ]
#    0.00005
#    model_params.diversity_theta: [ 0.1, 0.01 ]
    model_params.num_negatives: [ 4, 8, 16 ]
    model_params.diversity_lambda: [ 0.0001, 0.00001, 0.00005, 0.0002, 0 ]

# -----------------------------------------
# Fixed Overrides (Optional)
# -----------------------------------------
# These parameters are applied to all experiments but are not part of the search.
# Useful for reducing training time during search.

fixed_overrides:
  preranking:
    training.epochs: 30
    model_params.patience: 2
    model_params.diversity_theta: 0
    model_params.diversity_start_epoch: 0
    model_params.diversity_epochs: 30
    model_params.diversity_warmup_epochs: 0
    model_params.use_diversity_loss: 1
#    model_params.diversity_num_negatives: 8
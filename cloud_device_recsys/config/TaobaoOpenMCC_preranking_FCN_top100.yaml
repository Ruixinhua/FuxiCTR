# Exp 1: Baseline
dataset_id: "TaobaoOpenMCC"
seed: 2024
gpu: 0
debug:
  n_rows: null

vocab_pruning:
  enabled: true
  min_vocab_size: 400000
  min_reduction_ratio: 0.3
stages:
  preranking:
    enabled: true
    model: "DCNv3"
    features: ["FG1", "FG2", "FG3"]
    top_k: 100
    model_params:
      num_negatives:
      loss_type: "bpr"
#      task: "regression"
      use_diversity_loss: 0
      use_feature_encoder: 1
      metrics_k: [1, 10, 50, 100]
      embedding_dim: 16
      num_deep_cross_layers: 1
      num_shallow_cross_layers: 1
      num_heads: 16
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
      max_gradient_norm: 5.0
      learning_rate: 0.001
      monitor: "Recall@100"

    training:
      epochs: 10
      batch_size: 4096
      optimizer: "adam"
    metrics: ["nDCG", "Recall"]

output:
  root: "/scratch/dliu2/FuxiCTR/outputs"
  save_intermediate: true
  save_csv: true

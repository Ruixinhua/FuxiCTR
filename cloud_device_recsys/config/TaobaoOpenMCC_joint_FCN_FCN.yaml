# Joint Training: FCN (Cloud Preranking) + FCN (Device Reranking) on TaobaoOpenMCC
dataset_id: "TaobaoOpenMCC"
seed: 2024
gpu: 0
debug:
  n_rows: null

stages:
  preranking:
    enabled: true
    model: "DCNv3"
    features: ["FG1", "FG2"]
    top_k: 100
    model_params:
      num_negatives: 8
      loss_type: "bpr"
      use_diversity_loss: 0
      use_feature_encoder: 1
      embedding_dim: 32
      num_deep_cross_layers: 2
      num_shallow_cross_layers: 1
      num_heads: 8
      deep_net_dropout: 0.1
      shallow_net_dropout: 0.1
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
      max_gradient_norm: 5.0
      learning_rate: 0.001
      metrics_k: [1, 10, 50, 100]
      monitor: "Recall@100"
    training:
      epochs: 15
      batch_size: 4096
      optimizer: "adam"
  reranking:
    enabled: true
    model: "DCNv3"
    features: ["FG1", "FG2", "FG3"]
    top_k: 10
    model_params:
      num_negatives: 4
      loss_type: "bpr"
      use_feature_encoder: 1
      embedding_dim: 4
      hidden_units: [64, 32]
      num_deep_cross_layers: 1
      num_shallow_cross_layers: 1
      num_heads: 1
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
      max_gradient_norm: 5.0
      batch_norm: False
      learning_rate: 0.001
      monitor: "Recall@1"
      metrics_k: [ 1, 10 ]

    training:
      epochs: 10
      batch_size: 4096
      optimizer: "adam"
    metrics: ["nDCG", "Recall"]

  joint_training:
    epochs: 10
    learning_rate: 0.001
    use_contrastive_learning: false
    loss_type: bpr
    margin: 1.0
    monitor: "Recall@100"
    cl_weights:
      cl_loss_weight: 1.0
      group_aware_loss_weight: 0.5

output:
  root: "/scratch/dliu2/FuxiCTR/outputs"
  save_intermediate: true
  save_csv: true

# DTCN Preranking: DCNv3 (Cloud) + DCNv3 (Full/Teacher) on TaobaoAd
dataset_id: "TaobaoAd"
seed: 2024
gpu: 0
debug:
  n_rows: null

vocab_pruning:
  enabled: true
  min_reduction_ratio: 0.3
  min_vocab_size: 400000

stages:
  preranking:
    enabled: true
    model: "DCNv3"
    features: ["FG1", "FG2"]
    top_k: 100
    model_params:
      num_negatives: 4
      loss_type: "bpr"
      use_diversity_loss: 1
      diversity_lambda: 0.01
      diversity_theta: 0
      diversity_start_epoch: 0   # -1 = auto (Phase 1 early stop then Phase 2)
      diversity_epochs: 10         # Phase 2 training epochs
      diversity_warmup_epochs: 0  # Linear warmup for diversity lambda in Phase 2
      use_feature_encoder: 1
      metrics_k: [1, 10, 50, 100]
      embedding_dim: 32
      num_deep_cross_layers: 2
      num_shallow_cross_layers: 2
      num_heads: 16
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
      max_gradient_norm: 5.0
      learning_rate: 0.001
      inference_batch_size: 50000

    training:
      epochs: 10
      batch_size: 2048
      optimizer: "adam"
      monitor: "Recall@100"
    metrics: ["nDCG", "Recall"]

  # DTCN-specific: Full model (teacher) configuration
  dtcn:
    full_model: "DCNv3"
    full_features: ["FG1", "FG2", "FG3"]
    full_model_params:
      embedding_dim: 32
      use_feature_encoder: 1
      num_deep_cross_layers: 3
      num_shallow_cross_layers: 2
      num_heads: 16
#      deep_net_dropout: 0.0
#      shallow_net_dropout: 0.0
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
    # Pre-trained teacher path (null = train from scratch)
#    full_model_path: /scratch/dliu2/FuxiCTR/outputs/TaobaoAd/FCN_full_features_hyper_v3/seed_2024__pembedding_dim_32__pnum_deep_cross_layers_3__pnum_heads_32__pnum_shallow_cross_layers_2__39e457/preranking/TaobaoAd/DCNv3_20260304_091441.model
    full_model_path: /scratch/dliu2/FuxiCTR/outputs/TaobaoAd/FCN_full_features_hyper_v4/seed_2024__pnum_deep_cross_layers_3__pnum_heads_16__pnum_negatives_10__pnum_shallow_cross_layers_2__194614/preranking/TaobaoAd/DCNv3_20260308_022508.model
    freeze_full_model: true
    # CL configuration
    cl_loss_weight: 0.1
    cl_use_logits: 1
    full_model_loss_weight: 1.0
    cloud_model_loss_weight: 1.0

output:
  root: "/scratch/dliu2/FuxiCTR/outputs"
  save_intermediate: true
  save_csv: true

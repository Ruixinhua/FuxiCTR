# Exp 1: Baseline
dataset_id: "TaobaoOpenMCC"
dataset_config: "./config/dataset_config.yaml"
seed: 2024
gpu: 0
debug:
  n_rows: null

candidates:
  preranking:
    source: "retrieval_candidates.parquet"
    top_k: 100
    output: "preranking_candidates.parquet"

stages:
  preranking:
    enabled: true
    model: "DINRanker"
    features: ["FG1", "FG2"]
    top_k: 100
    use_diversity: true
    model_params:
      metrics_k: [10, 50, 100]
      monitor: "Recall@100"
      embedding_dim: 32
      hidden_layers: [128, 64]
    training:
      epochs: 10
      batch_size: 2048
      learning_rate: 0.001
      optimizer: "adam"
    metrics: ["nDCG", "Recall"]

output:
  root: "/scratch/dliu2/FuxiCTR/outputs"
  save_intermediate: true
  save_csv: true

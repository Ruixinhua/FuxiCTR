# Exp 1: Baseline
dataset_id: "TaobaoOpenMCC"
dataset_config: "./config/dataset_config.yaml"
seed: 2024
gpu: 0
debug:
  n_rows: null

candidates:
  retrieval:
    source: "item_pool"
    output: "retrieval_candidates.parquet"

stages:
  retrieval:
    enabled: true
    model: "DualTowerRetrieval"
    features: ["FG1", "FG2"]
    top_k: 1000
    model_params:
      metrics_k: [1000, 5000, 10000]
      monitor: "Recall@1000"
      embedding_dim: 64
      use_user_transformer: 1
      user_transformer_layers: 1
      use_item_transformer: 0
      item_transformer_layers: 1
      user_tower_layers: [512, 256, 128, 64]
      item_tower_layers: [512, 256, 128, 64]
      embedding_regularizer: 1.0e-5
      net_regularizer: 1.0e-5
      max_gradient_norm: 5.0
      dropout: 0.1
    training:
      epochs: 10
      batch_size: 4096
      learning_rate: 0.001
      optimizer: "adam"
    metrics: ["Recall"]

output:
  root: "/scratch/dliu2/FuxiCTR/outputs"
  save_intermediate: true
  save_csv: true

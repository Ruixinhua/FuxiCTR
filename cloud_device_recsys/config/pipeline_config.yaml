# =============================================================================
# Pipeline Configuration for Cloud-Device Recommendation System
# =============================================================================
# This file defines pipeline stages, models, and evaluation settings.
# Dataset-specific settings are in dataset_config.yaml.

# -----------------------------------------
# Dataset Reference
# -----------------------------------------
dataset_id: "TaobaoOpenMCC"
dataset_config: "./config/dataset_config.yaml"

# -----------------------------------------
# Global Settings
# -----------------------------------------
seed: 2024
gpu: 0
debug:
  n_rows: null  # Set to integer (e.g., 100000) for quick testing, null for full data

# -----------------------------------------
# Pipeline Stages
# -----------------------------------------
stages:
  retrieval:
    enabled: true
    model: "DualTowerRetrieval"
    features: ["FG1", "FG2"]
    top_k: 100
    
    model_params:
      metrics_k: [1000, 5000, 10000]
      embedding_dim: 64
      use_user_transformer: 1
      user_transformer_layers: 1
      use_item_transformer: 0
      item_transformer_layers: 1
      user_tower_layers: [512, 256, 128, 64]
#      user_tower_layers: [256, 128, 64, 32]
      item_tower_layers: [512, 256, 128, 64]
#      item_tower_layers: [256, 128, 64, 32]
      embedding_regularizer: 1.0e-5  # L2
      net_regularizer: 1.0e-5        # L2
      max_gradient_norm: 5.0         # Gradient
      dropout: 0.1                   # Dropout for
      learning_rate: 0.001
      monitor: "Recall@1000"

    training:
      epochs: 10
      batch_size: 4096
      optimizer: "adam"

    metrics: ["Recall"]

  preranking:
    enabled: true
    model: "DIN"
    features: ["FG1", "FG2"]
    top_k: 100

    model_params:
      metrics_k: [10, 50, 100]
      embedding_dim: 32
      dnn_hidden_units: [128, 64]
      din_target_field: "cand_item_id"
      din_sequence_field: "ipv_item_id_seq"
      learning_rate: 0.001
      monitor: "Recall@100"

    training:
      epochs: 10
      batch_size: 2048
      optimizer: "adam"

    metrics: ["nDCG", "Recall", "MRR", "gAUC"]


  reranking:
    enabled: true
    model: "DIN"
    features: ["FG1", "FG2", "FG3"]  # Includes FG3 (device-only features)
    top_k: 10
    
    model_params:
      metrics_k: [5, 10, 50]
      embedding_dim: 4
      dnn_hidden_units: [64, 32]
      din_target_field: "cand_item_id"
      din_sequence_field: "ipv_item_id_seq"
      max_model_size_kb: 500  # Device model size constraint
      learning_rate: 0.001
      monitor: "Recall@1"
      use_cloud_score: true

    training:
      epochs: 10
      batch_size: 1024
      optimizer: "adam"
      monitor: "Recall@100"
      distillation:
        enabled: false
        teacher_model: null
        temperature: 3.0
        
    metrics: ["nDCG", "Recall", "MRR", "gAUC"]

# -----------------------------------------
# Output Settings
# -----------------------------------------
output:
  root: "./outputs"
  save_intermediate: true
  save_csv: true
